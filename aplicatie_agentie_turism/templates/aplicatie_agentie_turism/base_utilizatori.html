<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>{% block titlu %}Agenție de turism{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: .5rem; margin-bottom: 1rem; }
    nav form { display: inline; margin: 0; }
    .mesaj { padding: .5rem 1rem; margin: .5rem 0; background: #eef; border-left: 4px solid #66f; }
    .mesaj.success { background: #efe; border-color: #3a3; }
    .mesaj.error { background: #fee; border-color: #c33; }
    .errorlist { color: #c33; margin: 0; padding-left: 1rem; }
    table td { padding: .3rem 1rem .3rem 0; }
    form p { margin: .6rem 0; }
  </style>
</head>
<body>
  <nav>
    {% if user.is_authenticated %}
      <a href="{% url 'profil' %}">Profil ({{ user.username }})</a>
      <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button type="submit">Logout</button></form>
    {% else %}
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'inregistrare' %}">Înregistrare</a>
    {% endif %}
  </nav>
  {% for m in messages %}<div class="mesaj {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block continut %}{% endblock %}
</body>
</html>

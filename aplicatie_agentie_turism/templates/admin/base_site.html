{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
    {{ block.super }}
    <style>
        :root, [data-theme="dark"], [data-theme="light"] {
            --body-bg: #2b2b2b;            
            --body-fg: #f5f5f5;            
            --body-quiet-color: #b0b0b0;
            --primary: #4a148c;             
            --header-bg: #4a148c;           
            --header-color: #ffffff;
            --secondary: #4a148c;          
            --breadcrumbs-bg: #4a148c;
            --breadcrumbs-fg: #ffffff;
            --breadcrumbs-link-fg: #d1c4e9;
            --selected-bg: #3d2666;         
            --selected-row: #3d2666;
            --darkened-bg: #363636;        
            --link-fg: #ce93d8;
            --link-hover-color: #ea80fc;
        }

        #header {
            background-color: var(--primary) !important;
        }

        #branding h1, #branding h1 a {
            color: #ffffff !important;
        }

        .module h2, .module caption {
            background-color: var(--primary) !important;
            color: #ffffff !important;
        }
        
        #content h1 {
            color: #ffffff !important; 
            font-weight: bold;
        }

        #changelist-form, .module table, .default {
            background-color: var(--darkened-bg);
            color: var(--body-fg);
        }

        #branding h1 {
            display: flex;
            align-items: center;
        }
        
        #branding img {
            height: 40px;
            margin-right: 10px;
        }
    </style>
{% endblock %}

{% block branding %}
    <h1 id="site-name">
        <img src="{% static 'imagini/poza_index.jpeg' %}" alt="Sigla Zbor si Dor">
        <a href="{% url 'admin:index' %}">{{ site_header|default:_('Django administration') }}</a>
    </h1>
{% endblock %}
